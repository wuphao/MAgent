<!doctype html>
<html lang="zh-CN">
<head>

<title>RWE · 患者分析</title>
<style>
:root{--ink:#203630;--muted:#74827c;--green:#27745a;--line:#e3e9e3;--bg:#f4f6f2;--soft:#edf4ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}button:focus-visible,a:focus-visible{outline:3px solid #90bca6;outline-offset:4px}header{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4.5%}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:650;letter-spacing:.4px}.logo{display:grid;place-items:center;background:var(--ink);color:white;width:36px;height:36px;border-radius:11px;font-size:23px}.brand span{border-left:1px solid var(--line);margin-left:9px;padding-left:20px;font-size:14px;font-weight:400;color:#66766d}.badge{font-size:12px;border:1px solid #dce5d9;border-radius:6px;padding:4px 10px;color:#65745e;background:#f5f7f1}main{max-width:1440px;margin:auto;padding:38px 4.5% 40px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1{font-size:30px;letter-spacing:-1px;margin:0;font-weight:600}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:650;margin-bottom:7px}.heading-right{color:var(--muted);font-size:13px}.search-panel{display:flex;align-items:center;gap:26px;padding:23px 26px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:28px;box-shadow:0 4px 18px #20363003}.search-panel label{font-weight:600;white-space:nowrap}.input-wrap{display:flex;align-items:center;gap:12px;flex:1;border:1px solid #dce4dc;border-radius:8px;background:#fafbf9;padding:0 15px}.input-wrap:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #27745a13}.input-wrap span{color:var(--muted);font-size:20px}input{width:100%;border:0;outline:0;background:none;height:46px;color:var(--ink);letter-spacing:.7px}.primary{border:0;background:var(--green);color:#fff;padding:12px 24px;border-radius:8px;font-weight:600;white-space:nowrap}.primary:hover{background:#1e6049}.error{color:#a24832;margin:-18px 0 20px}.workspace{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-head{padding:23px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}h2{font-size:17px;margin:0;font-weight:600}.status{font-size:12px;color:var(--green);display:flex;gap:6px;align-items:center}.status:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.process{padding:25px 24px 5px}.step{position:relative;display:grid;grid-template-columns:29px 1fr;gap:13px;padding-bottom:27px}.step:not(:last-child):before{content:"";position:absolute;top:29px;bottom:0;left:13px;width:1px;background:#dce7de}.step-icon{width:28px;height:28px;background:var(--soft);border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:13px;z-index:1}.step strong{font-size:14px;font-weight:550}.step p{font-size:12px;color:var(--muted);margin:5px 0 0}.step.pending{opacity:.4}.step.running .step-icon{background:var(--green);color:white;box-shadow:0 0 0 5px #27745a12}.agents{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.agent{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;color:#62746a}.agent i{font-style:normal;color:var(--green);float:right}.process-footer{border-top:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.results{min-width:0}.result-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.patient{display:flex;gap:12px;align-items:center}.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#e8ede4;color:#6c806a}.patient strong{font-size:17px;font-weight:600;letter-spacing:.5px}.patient small{color:var(--muted);display:block;font-size:11px}.text-button{border:1px solid #dce3da;background:transparent;color:#4c6154;border-radius:7px;padding:7px 12px;font-size:12px}.summary{background:#eaf1e7;border:1px solid #dae5d5;padding:25px 28px;border-radius:12px;position:relative}.summary-top{display:flex;justify-content:space-between;align-items:center;color:#52704e;font-size:12px}.summary-top span:last-child{background:#fff9;border-radius:5px;padding:2px 8px}.summary h3{font-size:23px;font-weight:550;margin:14px 0 9px;letter-spacing:-.4px}.summary p{margin:0;color:#63765e;font-size:13px;max-width:680px;line-height:1.9}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 23px}.metric{padding:17px 20px;background:white;border:1px solid var(--line);border-radius:10px}.metric-label{color:#748176;font-size:12px}.metric-value{font-size:29px;font-weight:550;line-height:1.5;letter-spacing:-1px}.metric-value small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:5px}.metric-bottom{font-size:11px;color:var(--green)}.tabs{display:flex;gap:27px;padding:0 24px;border-bottom:1px solid var(--line)}.tab{padding:16px 0 13px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:13px}.tab.active{border-color:var(--green);color:var(--green);font-weight:600}.tab-content{padding:7px 24px 10px}.finding{display:grid;grid-template-columns:33px 1fr auto;gap:12px;padding:20px 0;border-bottom:1px solid var(--line);align-items:start}.finding:last-child{border:0}.finding-icon{background:#f2f5ef;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:#607657}.finding h3{font-weight:550;font-size:14px;margin:0 0 5px}.finding p{font-size:12px;color:var(--muted);margin:0;line-height:1.9}.tag{font-size:10px;color:#778572;white-space:nowrap;background:#f3f6f0;border-radius:4px;padding:3px 7px}.tag.warn{color:#a38146;background:#f8f3e8}.note{display:flex;gap:9px;margin-top:14px;color:#8a7856;font-size:12px;padding:0 2px}.footer{display:flex;justify-content:space-between;margin-top:26px;color:#94a091;font-size:11px}.loading{min-height:465px;display:grid;place-content:center;text-align:center;color:var(--muted)}.spinner{width:35px;height:35px;border:2px solid #e0e8dd;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}[hidden]{display:none!important}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:16px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:400}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 Consolas,monospace;color:#55705d;padding:15px} @media(min-width:1500px){main{padding-top:48px}}@media(max-width:1000px){.workspace{grid-template-columns:280px minmax(0,1fr)}.metric{padding:14px}.summary{padding:22px}.finding{grid-template-columns:30px 1fr}.finding>.tag{grid-column:2;justify-self:start}}@media(max-width:760px){header{padding:0 20px;height:66px}.brand span,.heading-right{display:none}main{padding:26px 18px}.workspace{grid-template-columns:1fr}.search-panel{gap:12px;flex-wrap:wrap;padding:18px}.search-panel label{width:100%}.primary{padding:12px 15px}.input-wrap{min-width:150px}.metrics{gap:8px}.metric{padding:12px}.metric-value{font-size:24px}.process{display:grid;grid-template-columns:1fr 1fr;gap:12px}.step{padding-bottom:17px}.step:before{display:none}.agents{grid-template-columns:1fr}.footer{gap:15px}.summary h3{font-size:21px}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}

.empty{min-height:360px;display:grid;place-content:center;text-align:center;padding:35px;color:var(--muted)}.empty h2{color:var(--ink);font-size:20px}.empty p{font-size:13px}.notice{padding:13px 17px;background:#fbf0e9;border:1px solid #eddbcd;border-radius:8px;margin:-12px 0 22px;color:#8a4b30}.toolbar{display:flex;gap:8px;align-items:center}.tabs{gap:22px;overflow-x:auto;white-space:nowrap}.step.failed .step-icon{color:#a04b35;background:#faeee8}.step.limited .step-icon{color:#9c7a39;background:#f6f0e3}.step p{overflow-wrap:anywhere}.summary h3{font-size:22px}.summary p{max-width:none}.finding p{font-size:13px;color:#66756b}.finding button{border:0;background:none;color:var(--green);font-size:12px;padding:5px 0 0}.evidence-tools{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0}.evidence-tools input{height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;max-width:260px;letter-spacing:0}.table-wrap{overflow-x:auto}.table-wrap td{vertical-align:top;min-width:80px;max-width:230px;overflow-wrap:anywhere}.table-wrap td.source{font:11px/1.6 Consolas,monospace;color:var(--muted);max-width:220px}.pager{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:14px 0;color:var(--muted);font-size:12px}.limited-list{margin:0;padding:10px 0;list-style:none}.limited-list li{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px;color:#706750}.score-select{width:100%;padding:10px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;font:inherit;margin:18px 0 5px}.chart{width:100%;height:210px;display:block}.chart-caption{font-size:12px;color:var(--muted);margin:0 0 10px}.filter-label{font-size:12px;color:var(--green)}.evidence-tools button{white-space:nowrap}.result-title .patient small{max-width:360px}.process{padding-bottom:3px}.step{padding-bottom:23px}.tag{font-size:11px}.metric-bottom{display:none}.panel-head .status{max-width:110px}.text-button:disabled{cursor:default}.status.error{color:#a04b35}.status.busy{color:#9c7a39}.status{margin:0}.footer{justify-content:flex-end}.finding{grid-template-columns:1fr auto}.finding h3{font-size:12px;color:var(--green)}.finding:first-child{border-top:0}body{font-size:14px}@media(max-width:760px){.toolbar{gap:5px}.text-button{padding:6px 8px}.patient strong{font-size:15px}.result-title{gap:10px;flex-wrap:wrap}.process{grid-template-columns:1fr}.step{padding-bottom:10px}.tabs{gap:18px}.evidence-tools{flex-wrap:wrap}}
.workspace{align-items:start}.tab-content{max-height:570px;overflow:auto}.status{flex-shrink:0}
</style></head>
<body>
<header><div class="brand"><div class="logo">✳</div>RWE <span>多智能体分析平台</span></div><span class="badge" id="connection">连接中</span></header>
<main>
<div class="heading"><h1>患者分析</h1></div>
<form class="search-panel" id="search"><label for="patient-id">RWE 患者 ID</label><div class="input-wrap"><span aria-hidden="true">⌕</span><input id="patient-id" value="041_S_4060" placeholder="输入患者编号" autocomplete="off" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" title="请输入患者编号，支持字母、数字、下划线和短横线"></div><button class="primary" id="start" type="submit">开始分析 ↗</button></form>
<div class="notice" id="error" role="alert" hidden></div>
<div class="workspace">
<aside class="panel"><div class="panel-head"><h2>分析过程</h2><span class="status" id="process-status">待开始</span></div><div class="process" id="steps"></div><div class="process-footer"><span id="stage-message">等待患者数据</span><span id="progress">0 / 8</span></div></aside>
<section class="results" aria-label="分析结果"><div class="result-title"><div class="patient"><span class="avatar" aria-hidden="true">◎</span><div><strong id="current-patient">尚未分析</strong><small id="source-info">本地 RWE</small></div></div><div class="toolbar"><button class="text-button" id="source-download" disabled>↓ 患者 JSON</button><button class="text-button" id="export" disabled>↓ 报告</button></div></div>
<div class="panel empty" id="empty"><h2>从一位患者开始</h2><p>输入编号，查看分析过程与结果</p></div>
<div id="loading" class="panel loading" hidden role="status"><div class="spinner"></div><h2>正在分析</h2><p id="loading-label"></p></div>
<div id="report" hidden><div class="summary"><div class="summary-top"><span>综合分析结果</span><span id="report-status"></span></div><h3 id="summary-title"></h3><p id="summary-text"></p></div>
<div class="metrics"><div class="metric"><div class="metric-label">表单记录</div><div class="metric-value" id="record-count"></div></div><div class="metric"><div class="metric-label">字段观测</div><div class="metric-value" id="observation-count"></div></div><div class="metric"><div class="metric-label">分析发现</div><div class="metric-value" id="finding-count"></div></div></div>
<div class="panel"><div class="tabs" role="tablist" aria-label="报告视图">
<button class="tab active" role="tab" aria-selected="true" aria-controls="overview" id="tab-overview" data-tab="overview">分析发现</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="longitudinal" id="tab-longitudinal" data-tab="longitudinal" tabindex="-1">随访变化</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="evidence" id="tab-evidence" data-tab="evidence" tabindex="-1">证据溯源</button>
<button class="tab" role="tab" aria-selected="false" aria-controls="review" id="tab-review" data-tab="review" tabindex="-1">复核与限制</button></div>
<div class="tab-content" id="overview" role="tabpanel" aria-labelledby="tab-overview"></div>
<div class="tab-content" id="longitudinal" role="tabpanel" aria-labelledby="tab-longitudinal" hidden></div>
<div class="tab-content" id="evidence" role="tabpanel" aria-labelledby="tab-evidence" hidden><div class="evidence-tools"><input id="evidence-search" aria-label="搜索证据" placeholder="搜索表单、字段或日期"><span id="evidence-count" class="filter-label"></span><button class="text-button" id="clear-evidence">显示全部</button></div><div class="table-wrap" id="evidence-table"></div><div class="pager"><button class="text-button" id="prev-page">上一页</button><span id="page-label"></span><button class="text-button" id="next-page">下一页</button></div></div>
<div class="tab-content" id="review" role="tabpanel" aria-labelledby="tab-review" hidden></div></div>
</div></section></div><div class="footer"><span id="footer-info">数据导出与分析均在本机完成</span></div>
</main><script src="/ui/dashboard.js" defer></script></body></html>
