[deepseek]
api_key = 'sk-319c2ac879c644d7affccdaec0c09728'
base_url = "https://api.deepseek.com"
chat_model = "deepseek-chat"
temperature = 0.1

[rag]
enabled = true
provider = "chroma" # chroma, qdrant, or pgvector
persist_dir = "data/chroma"
collection_name = "local_docs"
chunk_size = 800
chunk_overlap = 120
top_k = 4
candidate_k = 20
embedding_provider = "sentence_transformers" # sentence_transformers or hash
embedding_model = "BAAI/bge-m3"
embedding_dimensions = 1024
reranker_provider = "cross_encoder" # cross_encoder or none
reranker_model = "BAAI/bge-reranker-v2-m3"
vector_weight = 0.65
keyword_weight = 0.35
min_relevance = 0.08
max_context_chars = 12000
log_path = "data/rag_queries.jsonl"
qdrant_url = "http://localhost:6333"
postgres_dsn = ""

[memory]
enabled = true
path = "data/memories.json"
top_k = 5
