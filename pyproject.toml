[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-rwe"
version = "0.1.0"
description = "Traceable multi-agent RWE analysis prototype."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
rwe = [
  "requests>=2.31,<3",
  "psycopg2-binary>=2.9,<3",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_imaging: requires verified DiaMond runtime inputs, model weights, and environment",
  "real_rag: requires a running Ollama service and the configured embedding model",
]

